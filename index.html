 Нужны отдельные листы бумаги, не красивый блокнот.", "Письменно ответь: «Чем меня защищает работа с небольшим доходом в найме?»", "Дальше: «Что плохого произойдёт, если я начну зарабатывать в три-четыре раза больше?» Копай глубоко: страх не видеть детей, задеть мужа, осуждения родных, зависти.", "И: «Что я потеряю, если стану финансово свободной?»", "Перечитай вслух. Скажи: «Я вижу вас, мои страхи. Вы пытались меня защитить. Но эта защита мне больше не нужна. Я взрослая, и я справлюсь».", "Порви листы и аккуратно сожги — над раковиной или на улице. Пепел смой водой.", "Сразу открой блокнот и напиши пару предложений о новой реальности."], "phrase": "Я могу зарабатывать хорошие деньги, оставаясь заботливой мамой и любящей женой.", "source": "Финансовый гороскоп, практика 1"}, {"id": "ustanovki", "title": "Аудит родительских установок", "short": "Переписать фразы из детства", "time": "1–2 дня на сбор, потом 21–40 дней чтения", "why": "Второй дом карты — это и деньги, и родительская семья. Детские фразы о деньгах мы несём во взрослую жизнь как истину, не замечая этого.", "steps": ["Раздели лист вертикальной чертой. Слева — всё, что ты слышала о деньгах в детстве: «деньги достаются тяжёлым трудом», «мы люди маленькие», «деньги портят людей».", "Походи с этим день-два, дописывай, что всплывает. Без осуждения родителей — они передавали то, во что верили.", "Справа напротив каждой фразы — новая, твоя, звучащая для тебя естественно.", "Левую часть отрежь и выброси. Правую — на холодильник, на стол или в телефон.", "Читай новые установки каждое утро или перед сном — минимум 21 день, в идеале 40."], "phrase": "Большие деньги дают мне больше возможностей для себя и своей семьи.", "after": "Утренняя практика пополнится чтением новых установок.", "source": "Финансовый гороскоп, практика 2"}, {"id": "pismo", "title": "Письмо своим деньгам", "short": "Помириться с деньгами", "time": "30–40 минут", "why": "Проективная практика: деньги — как живой знакомый, с которым у тебя натянутые отношения. Ты хочешь, чтобы он был рядом, но боишься пустить его насовсем.", "steps": ["Сядь в спокойной обстановке, возьми ручку и бумагу. Начни: «Здравствуй, мой друг Деньги».", "Честно напиши, почему ты их боишься: что придётся работать сутками, не видеть детей, что родные начнут завидовать.", "Напиши, как ты их отталкивала: пряталась за маленькой безопасной зарплатой, обесценивала свои знания.", "В конце смени тон — пригласи их на новых условиях: легко, через любимое дело, сохраняя баланс и здоровье.", "Подпиши. Сохрани в блокноте или прочитай один раз вслух и убери."], "phrase": "Приходи ко мне легко, через любимое дело, сохраняя мой баланс. С любовью и благодарностью, Катя.", "after": "Перечитывай письмо, когда снова накрывает тревога из-за денег.", "source": "Финансовый гороскоп, практика 4"}, {"id": "stulya", "title": "Два стула: Прагматик и Творец", "short": "Договориться с собой", "time": "30–40 минут, одна дома", "why": "Ты дважды Близнецы — внутри всегда два голоса. Если «убить» Творца — будет тоска, если отмахнуться от Прагматика — парализует страх безденежья. Задача — не выбрать одну, а подружить обеих.", "steps": ["Поставь два стула друг напротив друга на расстоянии метра. Один — Катя-Прагматик, другой — Катя-Творец.", "Сядь за Прагматика. Вслух скажи всё, что тревожит: про стабильность, детей, гарантии.", "Встань, сбрось роль, пересядь. Как Творец — ответь с уважением: «Я слышу тебя, спасибо, что ты заботишься о нас. Но пойми и меня…»", "Пересаживайся столько раз, сколько нужно, пока не появится конкретный компромисс. Например: ещё полгода декрета, и каждый день — время на портфолио и первые консультации.", "Встань между стульями, руки на груди. Почувствуй, что обе — это ты."], "phrase": "Одна даёт мне твёрдую почву, другая — крылья. Обе — это я.", "source": "Код Лакшми, практика 2"}, {"id": "napravlenie", "title": "Прислушаться к направлениям", "short": "Найти отклик", "time": "неделя-две, без спешки", "why": "Не нужно решать всё за один день. Нужно дать уму пищу и заметить, куда тянет сильнее.", "steps": ["Открой раздел «Мой путь» и перечитай три направления.", "Заметь, какое отзывается сильнее — не головой, а интересом.", "Почитай статьи, посмотри бесплатные уроки именно по нему.", "Запиши в блокнот: что зацепило, что смутило, какой маленький следующий шаг ты видишь."], "phrase": "Я делаю шаги в своём темпе — бережно и с любовью к себе.", "source": "Финансовый гороскоп, итог"}], "route_done": {"title": "Маршрут пройден", "text": "Ты прошла все шаги. Дальше опора — ежедневная практика, твои правила и раздел «Меня накрыло». Если захочешь, маршрут можно пройти заново: эти практики со временем открываются по-новому."}, "daily": {"morning": [{"title": "Кто я сегодня", "text": "Открой блокнот и напиши ровно три предложения, начиная со слов «Сегодня я…» — не из бытовой роли, а из роли создателя своей жизни. Например: «Сегодня я — проводник важных знаний для людей, которые запутались».", "tag": "3 предложения"}, {"title": "Вода с установкой", "text": "Натощак, перед первым глотком, прошепчи на воду: «Я наполняюсь спокойствием, уверенностью и силой». И вообще — не пить на бегу и в плохом настроении.", "tag": "1 минута"}, {"title": "Новые установки", "text": "Прочитай правую колонку из аудита родительских установок. 21 день — минимум, 40 — полный цикл.", "tag": "после шага «Аудит установок»", "requires": "ustanovki"}, {"title": "План на день", "text": "Две-три маленькие цели на сегодня. Меркурий любит, когда мысли вынесены на бумагу, а Марс — когда энергия идёт по плану, а не по настроению.", "tag": "5 минут"}], "day": [{"title": "Движение", "text": "Любая физическая нагрузка: быстрый шаг, лестница пешком, прогулка с коляской в темпе. Идеально — вода: бассейн, аквааэробика.", "tag": "Марс и Луна"}, {"title": "Природа", "text": "Прогулка на свежем воздухе, хоть ненадолго. Заземляет мысли и успокаивает Луну.", "tag": "Меркурий"}, {"title": "Режим сохранения энергии", "text": "Без пустых разговоров, лишних сериалов и выяснений отношений. Кто-то кого-то где-то обсуждает — а у Кати режим сохранения энергии.", "tag": "Марс в Раке"}], "evening": [{"title": "Дневник ценности", "text": "Перед сном — два вопроса. «В чём я сегодня была молодец?» и «Какую ценность я сегодня дала другим?» Подойдёт всё: вкусный ужин, 15 минут для себя, совет подруге.", "tag": "каждый вечер"}, {"title": "Тишина", "text": "Хотя бы 30 минут без детей, мужа и телефона. Твоя Луна в Близнецах впитывает за день много чужих эмоций и информации.", "tag": "30 минут", "conflict": "С двумя детьми ровно 30 минут — не всегда реально. Подойдёт и то, что получилось: душ, тёплая ванна, десять минут на балконе."}, {"title": "Выдохнуть день", "text": "Если что-то накопилось — выпиши в дневник всё подряд, и негатив, и позитив. Или пропой громко любимую песню в душе.", "tag": "по желанию"}], "optional": [{"title": "Рассвет и Гаятри-мантра", "text": "Встать на рассвете, включить Гаятри-мантру, посидеть в тишине. Божество твоего Солнца — Савитар, первые лучи солнца; астролог называет это для тебя «очень-очень крутой рекомендацией». Точное время — Брахма-мухурта.", "tag": "когда получится", "conflict": "С маленькими детьми ранний подъём не всегда возможен. Это не обязанность — делай, когда есть силы."}]}, "weekly": {"1": {"title": "Понедельник, день Луны", "items": [{"title": "Светлое и капля зелёного", "text": "Одежда молочных или белых тонов и маленькая светло-зелёная деталь: шарфик, кольцо с зелёным камнем. Так соединяются Луна и Меркурий.", "tag": "образ"}, {"title": "Помощь мамам", "text": "Небольшая помощь мамам, беременным, женщинам — вещами, продуктами или просто вниманием. Забота о материнстве — естественный для тебя источник благой кармы.", "tag": "благое дело"}]}}, "anytime": [{"title": "День без соцсетей", "text": "Раз в неделю — день без соцсетей и лишних новостей. День выбираешь сама.", "tag": "раз в неделю"}, {"title": "Маме с дохода", "text": "С каждого нового дохода — хоть небольшая сумма на радость маме: цветы, чай, массаж, перевод «для радости».", "tag": "с каждого дохода"}, {"title": "Искусство", "text": "Театр, кино, выставки — подпитывают Венеру. Без них жизнь начинает казаться уныло-серой.", "tag": "регулярно"}, {"title": "Руками", "text": "Творческое хобби руками: рисовать, лепить, шить, вязать. Успокаивает и усиливает Венеру.", "tag": "регулярно"}], "lunar": {"5": {"title": "5-е лунные сутки", "text": "Если тебе близки ведические ритуалы: распечатать изображение Раху-Кету в виде змеи, поставить перед ним миску молока. Молоко не пить — потом вылить под любое дерево. Астролог советует в этот день не есть, только вода.", "tag": "по желанию, ориентировочно", "conflict": "Голодание в декрете и при кормлении — плохая идея. Если делаешь ритуал, оставь только молоко и дерево."}}, "situations": [{"id": "trevoga", "title": "Мысли по кругу, страшно ошибиться", "trigger": "Прокручиваешь одни и те же пугающие сценарии и не можешь остановиться.", "answer": "Луна в Близнецах любит всё объяснять логически. Пока чувства варятся в голове — хаос. Как только переводишь их в схему, ум успокаивается, а тело расслабляется.", "steps": ["Лист А4 горизонтально. В центре кружок, в нём — главный страх, как есть: «Мне страшно принять неверное решение».", "Ветка «Тело»: что чувствуешь — зажим в плечах, ком в горле. Плечи к ушам на вдохе, задержка 5 секунд, с шумным выдохом бросить вниз. Три раза.", "Ветка «Мысли»: выпиши все пугающие фразы. Напротив каждой — «факт» или «гипотеза». «У меня ничего не получится» — гипотеза.", "Ветка «Действие»: только то, что можно сделать за 15 минут. Стакан тёплой воды, обнять детей, план на завтра, разминка для шеи."], "phrase": "Это не факт. Это гипотеза.", "source": "Код Лакшми, практика 1"}, {"id": "vybor", "title": "Сад или своё дело — не могу выбрать", "trigger": "Метаешься между «надо» и «не надо», между стабильностью и своим путём.", "answer": "В тебе спорят Катя-Прагматик и Катя-Творец. Подавлять одну — ошибка: без Творца будет тоска, без Прагматика — страх безденежья. Нужен не выбор, а договор между ними.", "steps": ["Не принимай решение сегодня, если ты на эмоциях.", "Сделай «Два стула», когда будешь одна дома: дай высказаться обеим, найди конкретный компромисс.", "Вспомни: сейчас возврат Сатурна, и сомнения — знак того, что старые программы закончились, а не того, что ты не справишься."], "phrase": "Я слышу тебя. Давай найдём выход вместе, чтобы и тебе было спокойно, и я могла развиваться.", "source": "Код Лакшми, Финансовый гороскоп"}, {"id": "zlost", "title": "Злюсь, накопилось", "trigger": "Раздражение на мужа, на усталость, на ситуацию — и хочется промолчать и проглотить.", "answer": "Марс в Раке склонен не ругаться открыто, а проглатывать злость и уходить в себя. Но энергия никуда не девается — оседает в теле и, по словам астролога, блокирует и деньги. Её нужно выпускать — так, чтобы не пострадали ни ты, ни муж, ни дети.", "steps": ["Письмо гнева: на черновиках пиши всё, самыми резкими словами, без фильтра. Почувствуешь пустоту — порви в клочья и выброси.", "Голос: громко пропой динамичную песню, покричи в подушку, в душе — во весь голос.", "Руки: замеси тугое тесто, порви старые журналы. Или брось с силой кубики льда в ванну — пусть разбиваются.", "Назови вслух: «Я сейчас злюсь». Осознанность уже снижает градус."], "phrase": "Я сейчас злюсь.", "source": "Финансовый гороскоп, Восходящие Близнецы"}, {"id": "kupit", "title": "Хочется что-то купить", "trigger": "Поздно вечером, усталость, открываешь маркетплейс и складываешь в корзину.", "answer": "Когда грустно или пусто, мозг просит быстрой радости, а самая простая — покупка. Пять минут радости, потом вина. Правило 24 часов не запрещает — оно даёт эмоции утихнуть и включить трезвый Меркурий.", "steps": ["Если это не продукты и не необходимое — скажи вслух фразу ниже.", "Положи в корзину и закрой приложение.", "Спроси себя: «Я правда этого хочу — или просто устала и хочу, чтобы меня пожалели?»", "Если второе — дай себе заботу напрямую: чай с травами, ванна, попроси мужа обнять.", "Через сутки посмотри снова. Если вещь всё ещё нужна и будет радовать — покупай смело."], "phrase": "Какая классная вещь! Я обязательно её куплю. Но завтра.", "source": "Финансовый гороскоп"}, {"id": "cena", "title": "Неловко назвать цену", "trigger": "Нужно сказать стоимость — и тянет сделать скидку, бесплатно, «у неё же сложная ситуация».", "answer": "Ослабленный Марс в Раке хочет быть хорошим и удобным. Но работа из жалости или вины, по словам астролога, сливает энергию твоего денежного канала. Ценность — не то, что надо оправдывать.", "steps": ["Не называй цену в моменте, если сжалось внутри. Возьми паузу: «Я пришлю условия сегодня вечером».", "Перечитай свой список навыков из «Распаковки».", "Назови цену один раз, спокойно, без оправданий и без «ну если дорого…».", "Если очень хочется помочь бесплатно — это отдельное решение, а не скидка из неловкости."], "phrase": "Стоимость консультации — … Если подходит, давайте выберем время.", "source": "Код Лакшми, анти-действие 1"}, {"id": "net_sil", "title": "Нет настроения работать", "trigger": "«Напишу пост на следующей неделе», «сделаю, когда будет вдохновение».", "answer": "Водный Марс склонен ждать идеального настроения. Сатурн в доме карьеры требует обратного: действие совершается потому, что запланировано. Энергия приходит в процессе, а не до него.", "steps": ["Уменьши задачу до смешного: один абзац, один звонок, 15 минут.", "Сделай его сейчас, даже без энтузиазма.", "Отметь в вечернем дневнике, что сделала."], "phrase": "Я делаю, потому что запланировала, а не потому что хочется.", "source": "Код Лакшми, анти-действие 3"}, {"id": "reshenie", "title": "Хочу крупную трату прямо сейчас", "trigger": "Кредит, рассрочка, договор, большая покупка — и ты расстроена, устала или обижена.", "answer": "Рак — эмоции, Марс — импульс. Любая финансовая сделка должна пройти через холодный фильтр разума, а не через бурю чувств. Сюда же — желание доказать свою значимость дорогой покупкой.", "steps": ["Ничего не подписывай и не оформляй сегодня.", "Запиши: что покупаю, зачем, что чувствую прямо сейчас.", "Вернись к этому, когда будешь спокойна. Если нужно — обсуди с мужем."], "phrase": "Я решу это завтра, на свежую голову.", "source": "Код Лакшми, анти-действие 2"}, {"id": "rodnye", "title": "Родные просят денег или помочь бесплатно", "trigger": "Дать в долг без договорённостей, взять чужой кредит, сделать проект родственникам даром.", "answer": "У тебя легко размываются границы в деньгах с семьёй. Спасательство взрослых родственников, по словам астролога, блокирует и твои деньги, и их возможность научиться самим.", "steps": ["Не отвечай сразу. Возьми время подумать.", "Если помогаешь — проговори чёткие условия: сколько, когда вернуть.", "Работа для родных — по тем же правилам, что для клиентов, или честный подарок, но не «бесплатно, потому что неудобно отказать»."], "phrase": "Мне нужно подумать, я отвечу завтра.", "source": "Код Лакшми, анти-действие 4"}, {"id": "zadel", "title": "Задел клиент или коллега", "trigger": "Хочется съязвить, ответить резко — или обиженно замолчать.", "answer": "Когда ранимо, Марс защищается сарказмом или пассивной агрессией. В работе речь должна быть бережной, но твёрдой: границы — фактами, а не эмоциями.", "steps": ["Не отвечай на эмоциях. Пауза — хотя бы час.", "Выпусти злость отдельно — письмом гнева или голосом.", "Ответь коротко и по фактам: что произошло, что тебе нужно."], "phrase": "Давайте я вернусь к этому чуть позже и отвечу по существу.", "source": "Код Лакшми, анти-действие 5"}, {"id": "ne_umeyu", "title": "Кажется, я ничего не умею", "trigger": "Обесцениваешь опыт, кажется, что всё было зря.", "answer": "Это естественное состояние в декрете: профессиональная часть засыпает. Но опыт никуда не делся — ты анализировала даты, помогала людям и уже зарабатывала на этом.", "steps": ["Открой свой список навыков. Если его ещё нет — это шаг маршрута «Распаковка навыков».", "Ответь на вопросы дневника ценности прямо сейчас, не дожидаясь вечера.", "Поговори с мужем. Юпитер в твоей карте светит на Луну из дома партнёрства: его вера в тебя способна успокоить тревогу."], "phrase": "Ты наделена способностью восстанавливаться и меняться — с какими бы данными ты ни пришла.", "source": "Финансовый гороскоп, Восходящие Близнецы"}, {"id": "pusto", "title": "Устала, пусто, выгораю", "trigger": "Сил нет ни на что, даже на то, что раньше радовало.", "answer": "Твой Марс работает рывками: загорелась, сделала рывок — нужен отдых. Если не отдыхать, случается выгорание. Забота о теле, сне и покое — это не лень, а условие, при котором всё остальное вообще работает.", "steps": ["Разреши себе просто побыть в декрете без чувства вины.", "Тело: тёплая ванна с магниевой солью, мягкая одежда, вкусная еда.", "Выговорись — мужу, подруге, психологу. Не держи в себе.", "Если тяжело неделями и не проходит — это повод обратиться к специалисту, а не терпеть."], "phrase": "Сейчас мне нужно восстановиться. Это тоже часть пути.", "source": "Финансовый гороскоп, Код Лакшми"}, {"id": "novoe", "title": "Начинаю новое дело", "trigger": "Первая консультация, курс, запуск, выход на работу.", "answer": "Сатурн любит дисциплину и постепенность, а Луна — тепло и благословение. Начало — момент, когда важно и то, и другое.", "steps": ["Попроси у мамы благословения — пусть просто скажет: «Пусть у тебя всё получится».", "Разбей задачу на этапы и запиши их.", "Определи первый шаг на завтра.", "Когда будешь оформлять ИП или самозанятость — можно взять в название что-то, связанное с мамой."], "phrase": "Начинаю с малого. Сатурн не любит спешки.", "source": "Финансовый гороскоп"}], "path": {"intro": "Астролог назвала три направления. Все они строятся на одном: сильный аналитический ум, забота о людях и чувство красоты. Выбирать не нужно сегодня.", "formula": "Аналитическая глубина + сердечная забота и эстетика + доверительное наставничество", "directions": [{"id": "nastavnik", "title": "Наставник", "subtitle": "дети, родители, педагогика нового уровня", "what": "Не возвращение воспитателем на прежнюю зарплату, а глубокая индивидуальная работа: диагностика, авторские методики, консультирование родителей.", "variants": ["Детский психолог или нейропсихолог", "Специалист по раннему развитию со своей методикой", "Консультант для родителей по воспитанию и способностям детей", "Сопровождение семей: режим ребёнка с учётом его психологии"], "why": "Юпитер — хозяин дома карьеры и показатель детей. В Навамше он стоит в доме детей и образования, в знаке лидерства: быть не исполнителем, а авторитетным специалистом.", "money": "Родители готовы платить за спокойствие и гармоничное развитие детей, за бесконфликтную атмосферу дома."}, {"id": "provodnik", "title": "Системный проводник", "subtitle": "нумерология, психологическое консультирование", "what": "Нумерология не как гадание, а как глубокая система анализа личности, с чётким планом для клиента на выходе.", "variants": ["Нумеролог-консультант с упором на психологию и профориентацию", "Своя система на стыке нумерологии и детской психологии", "Обучение нумерологии", "Сопровождение клиента на месяц вместо разовых консультаций"], "why": "Кету в доме карьеры — врождённое понимание тайных знаний. Марс в Ашлеше — способность глубоко «сканировать» людей. Сатурн требует глубины и структуры, поэтому лёгкий формат и пропавший интерес — не знак, что сфера не твоя.", "money": "Клиенты платят за глубокое понимание их индивидуальности без давления — и за порядок в мыслях и твёрдую опору.", "extra": "Рядом астролог называла и финансовое консультирование: личный и семейный бюджет, порядок в ресурсах."}, {"id": "tvorec", "title": "Творец пространства", "subtitle": "дизайн интерьера, хоумстейджинг, ландшафт", "what": "Работа на стыке красоты и точности: создавать реальные, осязаемые пространства и видеть результат.", "variants": ["Дизайнер интерьеров", "Ландшафтный дизайнер", "Хоумстейджер — стилист недвижимости", "Проектировщик мебели и кухонь", "«Дизайн, который лечит»: интерьер под психологию конкретной семьи"], "why": "Сильнейший Меркурий в доме пространства — чертежи, точность, расчёт. Венера в доме рук — вкус и «золотые руки». Марс и Меркурий в Козероге в Навамше — инженерная жилка.", "money": "Клиенты платят за ощущение дома, уюта и безопасности. Пятилетнее образование не обязательно — есть хорошие курсы."}], "start": ["Сделать шаги маршрута — навести порядок в голове.", "Побыть в декрете без вины и набраться сил.", "Заметить, какое направление откликается, и читать, смотреть бесплатные уроки по нему."]}, "rules": {"accepted": [], "accepted_empty": "Здесь появятся правила, которые ты примешь для себя сама. Пока это пусто — и это нормально.", "suggested": [{"title": "Не работаю из жалости", "text": "Без бесплатной работы и «символической» цены из чувства вины."}, {"title": "Не решаю деньги на эмоциях", "text": "Кредиты, рассрочки, крупные траты и договоры — только на спокойную голову."}, {"title": "Не жду вдохновения", "text": "Запланировала — делаю маленький шаг, даже без настроения."}, {"title": "Не спасаю родных деньгами", "text": "Семья и деньги — по прозрачным правилам; за взрослых не плачу их долги."}, {"title": "Не спорю на эмоциях в работе", "text": "Речь бережная и твёрдая; границы — фактами."}, {"title": "Правило Сатурна", "text": "Дисциплина, ответственность, терпение. Ценить своё и чужое время, не бояться медленного роста."}, {"title": "Правило Кету", "text": "Работа не должна быть банальной рутиной: нужны свобода, глубина и место для интуиции."}, {"title": "Правило Юпитера", "text": "Работа приносит пользу людям: быть проводником, наставником, учителем."}, {"title": "Знание — дальше", "text": "Информацию нельзя копить просто так. Узнала — расскажи другому или примени."}, {"title": "Пауза 24 часа", "text": "Между желанием купить и покупкой — сутки, если это не необходимое."}]}, "konspekt": [{"id": "natal", "title": "Восходящие Близнецы", "subtitle": "Полный разбор натальной карты", "sections": [{"title": "Задачи асцендента в Близнецах", "body": "— Определиться с предназначением и последовательно его осуществлять, а не хвататься за всё сразу. Стать экспертом в своей нише.\n— Довести умение общаться до совершенства: где-то промолчать, где-то красиво обыграть, чувствовать собеседника.\n— Избавиться от хаоса мыслей и упорядочивать информацию, которая проходит через тебя.\n— Вырабатывать упорство и усидчивость.\n— Преодолевать страх скуки и рутины и тревогу перед серьёзностью и ответственностью. Бороться с желанием всё бросить и «сменить картинку»."}, {"title": "Раху в 4-м доме, Кету в 10-м", "body": "Кету — таланты прошлой жизни, Раху — куда двигаться. Идти в зону Раху всегда дискомфортно, но если действовать постепенно и осознанно, жизнь начинает меняться.\n\nРаху в 4-м доме даёт внутреннее напряжение и недовольство: всё не так. Кармическая задача — научиться быть удовлетворённой своей жизнью, замечать то, что уже есть, и благодарить. Есть Мерседес — хочется Майбах: важно видеть хорошее, что уже есть.\n\nЭмоций много, и держать их внутри разрушительно. Нужно периодически давать им выход: стадион, рок-концерт, громкие песни в душе. Дневник благодарности.\n\nИдеально жить на земле, в своём доме, иметь контакт с природой — это успокаивает.\n\nКурение для этой позиции особенно неблагоприятно: 4-й дом связан с областью груди, а Раху — это дым.\n\nКету в 10-м: может тянуть часто менять профессию или сильно привязываться к работе и гордиться ею — и тогда разочарование. Нужно искать баланс между эмоциями и практичностью, не подавлять эмоции ради внешнего успеха."}, {"title": "Раху в Деве, Кету в Рыбах", "body": "Очень благоприятная, сбалансированная комбинация: практичный Раху и духовный Кету. Кету в Рыбах — интуиция, творчество, видение общей картины. Раху в Деве — способность не терять деталей: здоровье, порядок, анализ, дисциплина, служение, структурирование.\n\nЖизнь с таким положением полна резких поворотов, но даёт и внутренний рост, и материальный успех. Лучший путь — срединный: баланс между умом Девы и эмоциональностью Рыб, материальным и духовным.\n\nРаху в Деве даёт способность побеждать конкурентов и желание делать всё на отлично. Главная задача — не зацикливаться на деталях и мелочах."}, {"title": "Пунарвасу — твоё созвездие", "body": "Одна из трёх лучших накшатр: новая информация, знание, творчество, культура. Суть — «вскармливание» и «гармония», вера в то, что правильно приложенные усилия дают результат. Интеллект и эмоции равной силы, ораторский дар, защищённость от крупных неприятностей.\n\nШакти Пунарвасу — сила добиваться и возвращать цели: «триумфальное возвращение». Сдаваться нельзя — снова и снова пробовать, и с каждым разом получается лучше.\n\nПервая четверть, и Луна тоже здесь: двойное влияние. Забота, любознательность, энергичность, новаторство, лидерство — хорошо для воплощения идей."}, {"title": "Луна в 1-м доме, в Близнецах", "body": "Эмпатия: чувствуешь чужие эмоции кожей и берёшь их груз на себя. Отсюда чувствительность, частая смена настроений, трудность выбора, зависимость от мнения близких.\n\nЛуну гармонизируют физическая активность (походы, бег, велосипед, природа) и дыхательные практики, медитация.\n\nЛуна в Близнецах: очень умная, любознательная, наслаждаешься информацией, «рукастая», быстрый ум, прекрасно владеешь языком, не любишь одиночества. Обратная сторона — постоянное ментальное напряжение, много дел сразу при малой результативности, нервозность.\n\nСильные качества: гибкость, эмпатия, внимательность, заботливость, мягкость, тёплый семейный очаг. Слабые: трудная самоидентификация, ранимость, нерешительность, идеализация людей, зависимость от внешней оценки."}, {"title": "Марс во 2-м доме, в Раке, в Ашлеше", "body": "Дом денег активен: зарабатывание денег — часть предназначения. Деньги не упадут на голову — придётся трудиться, но потолок гораздо выше, чем у других. Может не хватать умения откладывать — полезно контролировать расходы.\n\nМарс в Раке ослаблен: огонь, залитый водой. Загораешься — и перегораешь, появляются страхи «а вдруг не справлюсь», склонность к прокрастинации. Лечится дисциплиной, как у спортсменов: чёткий план на день, маленькие цели, режим сохранения энергии — без пустых разговоров, соцсетей, выяснений отношений.\n\nМарс — планета души (Атмакарака): самая важная для проработки. Методы: силовой спорт, ежедневная нагрузка, чёткие цели по этапам, замечать гнев («Я сейчас гневаюсь»), водные процедуры, походы, следить за речью.\n\nАшлеша: проницательность, мощная интуиция, способность глубоко понимать людей, побеждать «без войны» — словом. Тень — тревоги, страхи, меланхолия, чувствительная нервная система. От страхов важно избавляться, при необходимости — со специалистом. Тотем Ашлеши — кот: кошка дома или хотя бы статуэтка гармонизирует.\n\nВторая четверть — стремление проявить себя в карьере и общественных делах."}, {"title": "Венера в 3-м доме, во Льве, в Магхе", "body": "Творческие способности, прикладное искусство, дизайн, эстетика. Любовь к путешествиям и чтению. Хобби — первоисточник энергии и вдохновения. Вести дневник.\n\nПо Венере возможен собственный бизнес: подчинение убивает творчество. Хороша в продажах.\n\nВенера во Льве: эффектная, стильная, умеешь вдохновлять других. Нужно быть ближе к искусству — театр, кино, выставки — и иметь творческое хобби руками.\n\nМагха: амбициозность, стремление к признанию, связь с предками и традициями. Совет астролога: проявлять женскую мудрость в семье, руководить мягко.\n\nТретья четверть Магхи — желание говорить и писать, собирать группы, вести мастер-классы, быть в центре внимания."}, {"title": "Солнце и Меркурий в 4-м доме, в Деве", "body": "Любишь свой дом и хочешь, чтобы он был предметом гордости. Благоприятен свой дом на земле, у воды. Успех в социальной реализации — через собственные усилия и с задержкой.\n\nСолнце в Деве: практичность, ум, умелые руки, честность, ответственность, любовь к порядку и режиму, умение улучшать системы. Нужна руководящая позиция; опасность — браться за много дел сразу. Слабые стороны — придирчивость и завышенные требования к окружающим.\n\nСолнце в Хасте: уверенность через осведомлённость о своих возможностях — безграничная способность восстанавливаться и меняться. Хорошая память, деловая хватка, «золотые руки», дар договариваться. Важно говорить правду простыми приятными словами. Рекомендация — вставать на рассвете и слушать Гаятри-мантру: божество Хасты — Савитар, первые лучи солнца.\n\nМеркурий в Деве экзальтирован — сильнейшая позиция. Логика, точность, организаторский талант, «человек-порядок». В Уттара Пхалгуни — реализация через партнёрство и брак, щедрость и честность при распределении ресурсов, умение дружить. Вторая четверть — структура, методичность, постепенный рост статуса."}, {"title": "Юпитер в 7-м доме, в Стрельце", "body": "Партнёрство с развивающимся человеком; «с кем поведёшься, от того и наберёшься» — близкие отношения с теми, у кого есть чему учиться. Искренность, доброжелательность, лёгкость в сотрудничестве и переговорах. Задача — смирение в паре: гордость и прямолинейность могут ранить.\n\nЮпитер в своём знаке: любовь к учёбе, путешествиям, поиску первопричин; хороший наставник и советчик. Слабость — категоричность и приверженность одной догме.\n\nПурва Ашадха: харизма, лидерство, способность выжидать и действовать, когда появляется шанс. Тень — поспешные выводы, упрямство, взрывной характер."}, {"title": "Сатурн в 10-м доме, в Рыбах", "body": "Трудолюбие и упорство. Карьера раскрывается во второй половине жизни, после 36 — медленно, но надолго. Важно не отказываться от этических принципов ради честолюбия.\n\nСатурн — это страхи: «а вдруг моё творчество никому не понравится». Его требования: дисциплина и держать слово; не привязываться — в том числе к деньгам, просто вкладываться в дело; терпение и спокойствие при задержках.\n\nУттара Бхадра: мудрость, сострадание, способность учитывать интересы всех и вовремя остановиться. Вторая четверть — искать мудрость в мелочах."}]}, {"id": "finance", "title": "Финансовый гороскоп", "subtitle": "Дома денег, практики, профессии", "sections": [{"title": "Всё сходится к Меркурию", "body": "Меркурий — управитель асцендента — стоит в Деве в 4-м доме, это Бхадра-йога. Но рядом Раху: нестандартность ума (отсюда тяга к нумерологии) и одновременно туман, сомнения, «хочу — не хочу».\n\nМеркурий стоит на 0°18′ — «состояние младенца»: огромный потенциал, который нужно растить.\n\nХозяин 11-го дома (большие деньги) Марс стоит во 2-м доме (накопления) — йога богатства. Цепочка: Марс в Раке → Луна → Близнецы → Меркурий в своём знаке. Все финансовые цепочки замыкаются на Меркурии."}, {"title": "Как растить Меркурий", "body": "— Планирование и списки в красивом блокноте.\n— Информационный детокс раз в неделю.\n— Учиться и передавать знания: информацию нельзя копить просто так.\n— Работа с речью: говорить мягко и чётко, читать вслух, вести дневник.\n— Прогулки и природа."}, {"title": "Второй дом: деньги как предназначение", "body": "Зарабатывание денег — часть жизненной задачи и инструмент роста. Мысли «может, мне это не надо» и желание спрятаться за маленькой стабильной зарплатой — уход от своей природы. Задача — разрешить себе зарабатывать без страха и вины.\n\nСейчас период сомнений — естественный для мамы в декрете. Отсюда четыре психологические практики: вторичная выгода, аудит установок, дневник ценности, письмо деньгам. Их не нужно делать за вечер «для галочки»."}, {"title": "Марс в Раке во 2-м доме", "body": "Плюсы: заработок через заботу (сад и нумерология — точное попадание), финансовая интуиция, готовность защищать семью.\n\nСложности: энергия рывками — нужен отдых, иначе выгорание; подавленный гнев — терпеть, копить, молча уйти; импульсивные траты от грусти.\n\nХозяйка дома денег — Луна в 1-м доме: заработок напрямую зависит от эмоционального состояния. Практики для Марса: экологичный выход гнева, правило 24 часов, спорт в воде. Для Луны: право на отдых и тишину, забота о теле, выговариваться."}, {"title": "Луна и мама", "body": "Луна — показатель мамы и хозяйка дома денег. Астролог советует: благодарить маму, с каждого дохода выделять ей что-то для радости, просить благословения на новое дело, использовать её имя или девичью фамилию в названии проекта."}, {"title": "Юпитер светит на Луну", "body": "Юпитер из 7-го дома аспектирует Луну. Муж — опора: его вера в тебя стабилизирует эмоции. И консультирование — как лекарство: помогая другим, ты успокаиваешься сама."}, {"title": "11-й дом", "body": "Пустой — значит, без жёстких ограничений. Управляет им Марс, поэтому проработка Марса и Луны включает и большие деньги. Марс во 2-й паде Ашлеши, которой управляет Меркурий — снова Меркурий."}, {"title": "10-й дом: ретроградный Сатурн и Кету", "body": "Сатурн: надёжность, способность руководить; задержки до 36 лет и синдром «тяжёлой ноши». Ретроградность — сомнения, гиперответственность. Кету: рутина ради выживания неинтересна, нужны независимость и смысл. Вместе — ощущение тупика: старые рельсы не устраивают, новые пока не видны.\n\nНо хозяин 10-го дома — сильный Юпитер в своём знаке: работа связана с передачей знаний, наставничеством, помощью людям.\n\nТри правила: Сатурна (дисциплина, терпение), Кету (не рутина, свобода, интуиция), Юпитера (польза людям, роль проводника)."}, {"title": "Направления", "body": "1. Детская психология, диагностика, педагогика нового уровня.\n2. Психологическое и эзотерическое консультирование, нумерология как система.\n3. Финансовое консультирование, порядок в ресурсах и бюджетах.\n4. Дизайн интерьера, хоумстейджинг, ландшафт, проектирование.\n\nВ итоге астролог свела их к трём путям: Наставник, Системный проводник, Творец пространства."}, {"title": "Время: возврат Сатурна и махадаша", "body": "Сейчас транзитный Сатурн вернулся на натальный — в 10-й дом, в Рыбы. Это мягкий экзамен по сфере работы и призвания: отсюда сомнения. Плюс идёт махадаша Сатурна до 30 апреля 2030.\n\nПо словам астролога, до весны 2030 — лучшее время, чтобы построить крепкую и стабильную карьеру. Без спешки, шаг за шагом."}]}, {"id": "lakshmi", "title": "Код Лакшми", "subtitle": "Инду лагна в Раке", "sections": [{"title": "Лакшми лагна в Раке", "body": "Деньги идут через мягкие энергии: созидание, поддержку, обучение, психологическую помощь, уют и безопасное пространство. Открытые сферы — дизайн и декор, дети и их развитие, консультирование."}, {"title": "Хозяйка — Луна в 1-м доме в Близнецах", "body": "— Источник денег — ты сама: работа под своим именем, личный бренд, блог, частная практика. Анонимный найм — закрытый путь.\n— Подача через речь и тексты: объяснять сложное простым языком.\n— Доход зависит от состояния: выгорание и игнорирование своих потребностей блокируют деньги. Сон, здоровье и покой — прямая обязанность."}, {"title": "Практики", "body": "1. Интеллектуальное картирование эмоций — тело, мысли (факт или гипотеза), действие на 15 минут.\n2. Два стула — Катя-Прагматик и Катя-Творец.\n3. «Кто я сегодня» — три утренних предложения."}, {"title": "Упайи для Луны", "body": "— Понедельник: светлая одежда с зелёной деталью.\n— По понедельникам — помощь мамам, беременным, женщинам.\n— Вода: не пить на бегу и в плохом настроении; утром — вода с установкой. Держать водный баланс."}, {"title": "Пять анти-действий", "body": "1. Обесценивать свой труд и работать из жалости или вины.\n2. Принимать финансовые решения на эмоциях.\n3. Ждать идеального настроения для работы.\n4. Сливать личные финансы с родственниками, спасать их деньгами.\n5. Резкая, колкая или пассивно-агрессивная речь в работе."}, {"title": "Суперсилы", "body": "1. Эмпатичное сканирование и мягкая мотивация: видишь, где у человека болит, ведёшь без давления.\n2. Безопасное пространство, «эффект гнезда»: превращаешь хаос — мысли, ситуацию, помещение — в гармоничную систему.\n\nМонетизация: премиальное наставничество вместо разовых консультаций; сопровождение семей; психологический дизайн интерьера."}, {"title": "Формула процветания", "body": "Аналитическая глубина (Меркурий в Деве, Кету в 10-м) + сердечная забота и эстетика (Рак, Венера в 3-м) + доверительное наставничество (Юпитер в 7-м).\n\nРабочее место: молочный, кремовый, жемчужный, серебристый + мятные и фисташковые акценты. На столе — вещь из серебра, перламутра или белого мрамора.\n\nЗадание на первые 24 часа: разобрать рабочее место и тепло написать маме."}]}, {"id": "tranzit", "title": "Раху по 10-му, Кету по 4-му", "subtitle": "Транзит узлов · даты в разборе не указаны", "sections": [{"title": "Раху в 10-м доме", "body": "Успех в карьере, профессиональная популярность, известность. Возможны смена работы, повышение, смена статуса. Минус — риск для репутации: сплетни, скандал, неудачные фото. Публичность стоит беречь."}, {"title": "Кету в 4-м доме", "body": "Дом матери: важно поддерживать маму.\n\nТранспорт: Кету забирает то, к чему мы привязаны. Старую машину можно сменить на более свежую подержанную; новую из салона в этот период лучше не покупать.\n\nУчёба: возможен перерыв или желание сменить сферу.\n\nЧастые поездки, командировки.\n\nНедвижимость: хорошо для ремонта и изменений, неблагоприятно для продажи. Новостройку лучше не покупать, вторичное жильё — хорошо.\n\nВозможен дискомфорт дома, вредители."}, {"title": "Про даты", "body": "Астролог не указала, когда действует этот транзит. Уточни у неё период, прежде чем опираться на советы про покупку или продажу."}]}, {"id": "lesha", "title": "Лёша", "subtitle": "Разбор сына · восходящие Близнецы", "sections": [{"title": "Характер", "body": "Дружелюбный, активный, любознательный, не может долго на одном месте; однообразие — скучно. Схватывает на лету, но может бросить на середине — важно помочь ему организоваться и почувствовать удовольствие от достижения цели. Фантазирует — это не враньё. Может хитро увиливать от неприятного."}, {"title": "Как говорить с Лёшей", "body": "— «Не делай этого» только подталкивает сделать. Не акцентировать запрет.\n— Общаться как со взрослым: не «потому что я сказала», а объяснять почему.\n— Не злоупотреблять «нельзя», не давить молчанием: если мама молчит и обижена, он теряет уверенность, что его любят.\n— Никогда не обманывать: он распознает ложь.\n— Не принуждать — так учат лгать. Апеллировать к уму и логике.\n— Требования — последовательные и обоснованные; свобода в мелочах в обмен на согласие в важном."}, {"title": "Луна в Деве в 4-м доме", "body": "Скрытный, не жалуется — внутри могут копиться обиды. Правило: каждый вечер рассказывать друг другу, как прошёл день; мама — первой. Не ругать: он и так самокритичен. Часто хвалить и ласкать, говорить, какой он хорошенький. Твёрдый режим дня. Быть эмоциональнее, а не только рациональной; не запрещать проявлять эмоции."}, {"title": "Ум и учёба", "body": "Одинаково успевает в гуманитарных и точных предметах. Нужна систематичность без пропусков и конкретные задачи. Если стал хуже учиться — либо пропустил тему, либо не нравится учитель. Больше интеллектуальных игр и развивающих книг; полезно чтение — учит слушать."}, {"title": "Солнце, Меркурий и Сатурн в Водолее", "body": "Личность, будет делать по-своему, часто спрашивать «почему?». Языки, технологии, фантастика, музыкальность. Учить командной работе и тому, что близким нужны его тепло и щедрость. Не реагировать бурно на странные идеи — терпимость сохраняет доверие. Учить отпускать прошлое и ошибки."}, {"title": "Юпитер и Венера в Рыбах", "body": "Талант — артистический, музыкальный, танцевальный, писательский. Водить на выставки и концерты, в походы и путешествия. Дневник благодарности, когда научится писать. Учить чуть разборчивее относиться к людям — он рвётся помогать всем."}, {"title": "Марс в Тельце в 12-м доме, узлы", "body": "Доброе сердце, писательский талант, организаторские способности. Нужны прогулки и физнагрузка. Учиться доводить дело до конца. Задача по узлам — уравновесить свои амбиции и интересы других, научиться прислушиваться к себе и отстаивать своё мнение."}, {"title": "Кружки и склонности", "body": "Кружки: восточные единоборства, иностранный язык, «Юный техник».\n\nСклонности: инновации, изобретения, технологии, инженерия; возможно — научная фантастика."}]}]}</script>

  try{ var m = location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/); if(m){ var p=m[1].split('-'); var h=(location.search.match(/[?&]h=(\d+)/)||[])[1]; return new Date(+p[0],+p[1]-1,+p[2], h?+h:new Date().getHours(), 0); } }catch(e){}

  var age=((d.getTime()-ref)/864e5)%syn; if(age<0) age+=syn;
  var name;
  if(age<1.85) name='новолуние'; else if(age<5.54) name='молодая луна'; else if(age<9.23) name='первая четверть';

function richText(s){
  var out='', paras=String(s||'').split(/\n\n+/);
  paras.forEach(function(p){
    var lines=p.split('\n');

  var finished=false; var t=setTimeout(function(){ if(!finished){finished=true;cb();} },1500);
  try{
    tg.CloudStorage.getItem(STORE_KEY,function(err,val){
      if(finished) return; finished=true; clearTimeout(t);
      try{ if(!err && val){ var v=JSON.parse(val); if(v && v.done) state=v; } }catch(e){}
      cb();
    });
  }catch(e){ if(!finished){finished=true;clearTimeout(t);cb();} }
}
function saveState(){
  var s=JSON.stringify(state);
  try{ localStorage.setItem(STORE_KEY,s); }catch(e){}
  if(cloudOk()){ try{ tg.CloudStorage.setItem(STORE_KEY,s,function(){}); }catch(e){} }
}

/* ---------- data ---------- */
function readSeed(){ try{ var t=$('seed').textContent; return JSON.parse(t); }catch(e){ return null; } }
function load(){
  var done=false;
  function finish(data,seed){ if(done) return; done=true; D=data; usedSeed=seed; if(!D){ stub(); return; } loadState(render); }
  try{
    fetch('data.json?v='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ finish(j,false); })
      .catch(function(){ finish(readSeed(),true); });
  }catch(e){ finish(readSeed(),true); }
}
function stub(){
  $('app').innerHTML='<div class="stub"><div class="caps">Катин путь</div><h1 style="font-weight:normal">Не получилось загрузить данные</h1><p class="lead">Проверь интернет и попробуй ещё раз.</p><button class="btn-o" id="retry">Попробовать снова</button></div>';
  $('retry').onclick=function(){ $('app').innerHTML=''; load(); };
}

/* ---------- route ---------- */
function currentStep(){
  for(var i=0;i<D.route.length;i++){ if(state.done.indexOf(D.route[i].id)<0) return {i:i, s:D.route[i]}; }
  return null;
}

/* ---------- render ---------- */
function render(){
  var tabsHtml='<nav class="tabs"><button data-tab="today" class="'+(tab==='today'?'on':'')+'">Сегодня</button><button data-tab="konspekt" class="'+(tab==='konspekt'?'on':'')+'">Конспекты</button></nav>';
  $('app').innerHTML=(tab==='today'?renderToday():renderKonspekt())+tabsHtml;
  bind();
}

function renderToday(){
  var d=today(), m=moon(d), h='';
  h+='<div class="wrap">';
  h+='<div class="dateline caps">'+WD[d.getDay()]+' · '+d.getDate()+' '+MONTHS[d.getMonth()]+' · '+m.name+'</div>';
  h+='<div class="portrait">'+(PHOTO.indexOf('data:')===0?'<img src="'+PHOTO+'" alt="">':'<div class="ph">К</div>')+'</div>';
  h+='<div class="name">'+esc(D.meta.name||'')+'</div>';

  var a=D.anchor;
  if(a){
    var end=parseD(a.to);
    if(end && d>end){
      h+='<div class="anchor"><div class="caps">'+esc(a.label)+'</div><div class="t">Период закончился</div><div class="d">Нужны новые даты от астролога</div></div>';
    } else {
      h+='<button class="anchor" data-open="anchor"><div class="caps">'+esc(a.label)+'</div><div class="t">'+esc(a.title)+'</div><div class="d">'+esc(a.name)+(a.to?' · до '+fmtD(a.to):'')+'</div><div class="more">что это значит</div></button>';
    }
  }

  // step
  var cs=currentStep();
  if(cs){
    var s=cs.s;
    h+='<div class="card step" data-open="step:'+s.id+'"><div class="caps k">Твой шаг к делу · шаг '+(cs.i+1)+'</div><h2>'+esc(s.title)+'</h2><p>'+esc(s.why)+'</p>';
    h+='<div class="row"><span class="meta">'+esc(s.time||'')+'</span><button class="btn-o" data-open="step:'+s.id+'">Открыть шаг</button></div></div>';
  } else {
    h+='<div class="card step done-card"><div class="caps k">Твой шаг к делу</div><h2>'+esc(D.route_done.title)+'</h2><p>'+esc(D.route_done.text)+'</p><button class="btn-o" data-act="restart">Пройти заново</button></div>';
  }
  h+='<div style="text-align:center;margin:-4px 0 6px"><button class="link" data-open="route">Весь маршрут</button></div>';

  // daily
  var part=partOfDay(d), items=(D.daily[part]||[]).filter(function(x){ return !x.requires || state.done.indexOf(x.requires)>=0; });
  var extra=[];
  var wk=D.weekly && D.weekly[String(d.getDay())];
  var ld=D.lunar && D.lunar[String(m.lday)];
  h+='<div class="sec caps">Практика дня · '+PART_NAME[part]+'</div><div class="card daily">';
  if(wk){ h+='<div class="daykey">'+esc(wk.title)+'</div>'; wk.items.forEach(function(x,i){ h+=itemHtml('w'+i,x); }); }
  if(ld){ h+='<div class="daykey">'+esc(ld.title)+' · ориентировочно</div>'+itemHtml('l',ld); }
  items.forEach(function(x,i){ h+=itemHtml(part+i,x); });
  h+='</div>';

  // help button
  h+='<div style="margin:22px 0 6px"><button class="btn-f" data-open="sits">Меня накрыло</button></div>';
  h+='<div style="text-align:center" class="meta">тревога, злость, хочется купить, страшно назвать цену</div>';

  // path
  var P=D.path;
  h+='<div class="sec caps">Мой путь</div>';
  if(P.formula) h+='<div class="formula">'+esc(P.formula)+'</div>';
  h+='<div class="path">';
  P.directions.forEach(function(x,i){ h+='<button class="pcard" data-open="dir:'+x.id+'"><span class="n">'+(i+1)+'</span><span><span class="tt">'+esc(x.title)+'</span><br><span class="sub">'+esc(x.subtitle)+'</span></span></button>'; });
  h+='</div>';

  // rules
  var R=D.rules;
  h+='<div class="sec caps">Мои правила</div><div class="card rules">';
  h+='<div class="caps" style="color:var(--rose-ink)">Решила сама</div>';
  if(R.accepted && R.accepted.length){ h+='<ul>'+R.accepted.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'; }
  else h+='<p class="empty">'+esc(R.accepted_empty||'')+'</p>';
  h+='<div class="caps" style="color:var(--rose-ink);margin-top:14px">Советует астролог</div><ul id="rul">';
  R.suggested.forEach(function(x,i){ h+='<li'+(i>=5?' class="hid" style="display:none"':'')+'><b>'+esc(x.title)+'.</b> '+esc(x.text)+'</li>'; });
  h+='</ul>'+(R.suggested.length>5?'<button class="link" data-act="morerules">Показать все</button>':'')+'</div>';

  // anytime
  var any=(D.anytime||[]).concat(D.daily.optional||[]);
  if(any.length){
    h+='<div class="sec caps">Помогает регулярно</div><div class="card daily">';
    any.forEach(function(x,i){ h+=itemHtml('a'+i,x,true); });
    h+='</div>';
  }
  if(usedSeed) h+='<div class="fallback">Показана сохранённая копия данных</div>';
  h+='<div class="foot">По разборам астролога. Цитаты — её слова, а не обещание результата.</div>';
  h+='</div>';
  return h;
}

function itemHtml(key,x,noCheck){
  var on=dailyMarks[key];
  var h='<div class="it" data-it="'+key+'">';
  if(!noCheck) h+='<span class="chk'+(on?' on':'')+'" data-chk="'+key+'">'+(on?'✓':'')+'</span>';
  h+='<div><div class="tt">'+esc(x.title)+(x.tag?'<span class="tg">'+esc(x.tag)+'</span>':'')+'</div>';
  if(x.text) h+='<div class="tx">'+esc(x.text)+(x.conflict?'<div class="conflict">'+esc(x.conflict)+'</div>':'')+'</div>';
  else if(x.conflict) h+='<div class="tx"><div class="conflict">'+esc(x.conflict)+'</div></div>';
  h+='</div></div>';
  return h;
}

function renderKonspekt(){
  var h='<div class="wrap"><div class="dateline caps">Конспекты</div><h1 style="font-weight:normal;text-align:center;font-size:26px;margin:0 0 6px">Все разборы</h1><p class="meta" style="text-align:center;margin:0 0 22px">'+esc(D.meta.sources_note? 'Всё, что сказал астролог, по темам' : '')+'</p>';
  D.konspekt.forEach(function(k){
    h+='<div class="acc" data-acc><button><div class="tt">'+esc(k.title)+'</div><div class="sub">'+esc(k.subtitle||'')+'</div></button><div class="in">';
    k.sections.forEach(function(s){ h+='<div class="sect"><div class="h">'+esc(s.title)+'</div><div class="b">'+richText(s.body)+'</div></div>'; });
    h+='</div></div>';
  });
  if(usedSeed) h+='<div class="fallback">Показана сохранённая копия данных</div>';
  h+='<div class="foot">'+esc(D.meta.sources_note||'')+'</div></div>';
  return h;
}

/* ---------- overlays ---------- */
function openOv(html,back){ $('ovc').innerHTML=(back?'<button class="back" data-open="'+back[0]+'">← '+back[1]+'</button>':'<button class="back" data-close>← Назад</button>')+html; $('ov').classList.add('show'); document.body.style.overflow='hidden'; $('ov').scrollTop=0; bindOv(); try{ tg && tg.BackButton && tg.BackButton.show(); }catch(e){} }
function closeOv(){ $('ov').classList.remove('show'); document.body.style.overflow=''; try{ tg && tg.BackButton && tg.BackButton.hide(); }catch(e){} }
try{ tg && tg.BackButton && tg.BackButton.onClick(function(){ closeOv(); }); }catch(e){}

function stepHtml(s){
  var idx=D.route.indexOf(s), done=state.done.indexOf(s.id)>=0;
  var h='<div class="caps" style="color:var(--rose-deep);margin-top:10px">Шаг '+(idx+1)+(s.time?' · '+esc(s.time):'')+'</div><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.why)+'</p>';
  if(s.note) h+='<div class="note">'+esc(s.note)+'</div>';
  h+='<ol class="steps">'+s.steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(s.phrase) h+='<div class="phrase">'+esc(s.phrase)+'</div>';
  if(s.after) h+='<div class="note">'+esc(s.after)+'</div>';
  h+='<div style="margin-top:20px">'+(done?'<button class="btn-o" style="width:100%" data-act="undo:'+s.id+'">Вернуть в маршрут</button>':'<button class="btn-f" data-act="done:'+s.id+'">Сделала</button>')+'</div>';
  if(!done) h+='<p class="meta" style="text-align:center;margin-top:10px">Шаг ждёт столько, сколько нужно</p>';
  h+='<div class="src">Источник: '+esc(s.source)+'</div>';
  return h;
}
function routeHtml(){
  var cs=currentStep();
  var h='<h1>Маршрут</h1><p class="lead">Шаги идут по порядку, но открыть можно любой. Без сроков.</p><div class="card rlist">';
  D.route.forEach(function(s,i){
    var cls=state.done.indexOf(s.id)>=0?'done':(cs&&cs.s===s?'cur':'');
    h+='<div class="r" data-open="step:'+s.id+'"><span class="dot '+cls+'"></span><div><div class="tt">'+esc(s.title)+'</div><div class="meta">'+esc(s.short||'')+'</div></div></div>';
  });
  return h+'</div>';
}
function sitsHtml(){
  var h='<h1>Что сейчас происходит?</h1><p class="lead" style="margin-bottom:18px">Выбери то, что ближе всего.</p><div class="sitlist">';
  D.situations.forEach(function(s){ h+='<button data-open="sit:'+s.id+'">'+esc(s.title)+'<span>'+esc(s.trigger)+'</span></button>'; });
  return h+'</div>';
}
function sitHtml(s){
  var h='<h1>'+esc(s.title)+'</h1><p class="trigger">'+esc(s.trigger)+'</p><p class="lead">'+esc(s.answer)+'</p>';
  h+='<div class="caps" style="margin:18px 0 10px;color:var(--rose-ink)">Что сделать</div><ol class="steps">'+s.steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(s.phrase) h+='<div class="phrase">'+esc(s.phrase)+'</div>';
  h+='<div class="src">Источник: '+esc(s.source)+'</div>';
  return h;
}
function dirHtml(x){
  var h='<div class="caps" style="color:var(--rose-deep);margin-top:10px">Направление</div><h1>'+esc(x.title)+'</h1><p class="trigger">'+esc(x.subtitle)+'</p><p class="lead">'+esc(x.what)+'</p>';
  h+='<div class="caps" style="margin:18px 0 8px;color:var(--rose-ink)">Как это может выглядеть</div><div class="card b"><ul>'+x.variants.map(function(v){return '<li>'+esc(v)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="caps" style="margin:18px 0 8px;color:var(--rose-ink)">Почему это в карте</div><p>'+esc(x.why)+'</p>';
  h+='<div class="caps" style="margin:18px 0 8px;color:var(--rose-ink)">За что платят</div><p>'+esc(x.money)+'</p>';
  if(x.extra) h+='<div class="note">'+esc(x.extra)+'</div>';
  h+='<div class="caps" style="margin:18px 0 8px;color:var(--rose-ink)">С чего начать</div><ol class="steps">'+D.path.start.map(function(v){return '<li>'+esc(v)+'</li>';}).join('')+'</ol>';
  return h;
}
function anchorHtml(){
  var a=D.anchor;
  var h='<div class="caps" style="color:var(--rose-deep);margin-top:10px">'+esc(a.label)+'</div><h1>'+esc(a.title)+'</h1><p class="trigger">'+esc(a.name)+(a.to?' · до '+fmtD(a.to):'')+(a.approximate_from?' · начало в разборе не указано':'')+'</p>';
  h+='<p class="lead">'+esc(a.meaning)+'</p>';
  if(a.also) h+='<p>'+esc(a.also)+'</p>';
  if(a.caution) h+='<div class="conflict" style="font-size:16px">'+esc(a.caution)+'</div>';
  h+='<div class="src">Источник: Финансовый гороскоп</div>';
  return h;
}
function route(key){
  var p=key.split(':'), t=p[0], id=p[1];
  if(t==='step'){ var s=D.route.filter(function(x){return x.id===id;})[0]; if(s) openOv(stepHtml(s)); }
  else if(t==='route') openOv(routeHtml());
  else if(t==='sits') openOv(sitsHtml());
  else if(t==='sit'){ var si=D.situations.filter(function(x){return x.id===id;})[0]; if(si) openOv(sitHtml(si),['sits','Все ситуации']); }
  else if(t==='dir'){ var di=D.path.directions.filter(function(x){return x.id===id;})[0]; if(di) openOv(dirHtml(di)); }
  else if(t==='anchor') openOv(anchorHtml());
}
function act(a){
  var p=a.split(':');
  if(p[0]==='done'){ if(state.done.indexOf(p[1])<0) state.done.push(p[1]); saveState(); haptic(); closeOv(); render(); var cs=currentStep(); toast(cs?'Следующий шаг открыт':'Маршрут пройден'); window.scrollTo(0,0); }
  else if(p[0]==='undo'){ state.done=state.done.filter(function(x){return x!==p[1];}); saveState(); closeOv(); render(); }
  else if(p[0]==='restart'){ state.done=[]; saveState(); render(); }
  else if(p[0]==='morerules'){ var hs=document.querySelectorAll('#rul .hid'); for(var i=0;i<hs.length;i++) hs[i].style.display=''; var b=document.querySelector('[data-act=morerules]'); if(b) b.remove(); }
}

/* ---------- binding ---------- */
function bind(){
  var app=$('app');
  app.onclick=function(e){
    var el=e.target;
    var chk=el.closest('[data-chk]'); if(chk){ e.stopPropagation(); var k=chk.getAttribute('data-chk'); dailyMarks[k]=!dailyMarks[k]; chk.classList.toggle('on'); chk.textContent=dailyMarks[k]?'✓':''; if(dailyMarks[k]) haptic(); return; }
    var tb=el.closest('[data-tab]'); if(tb){ tab=tb.getAttribute('data-tab'); render(); window.scrollTo(0,0); return; }
    var ac=el.closest('[data-act]'); if(ac){ act(ac.getAttribute('data-act')); return; }
    var op=el.closest('[data-open]'); if(op){ route(op.getAttribute('data-open')); return; }
    var it=el.closest('[data-it]'); if(it){ it.classList.toggle('open'); return; }
    var sh=el.closest('.sect>.h'); if(sh){ sh.parentNode.classList.toggle('open'); return; }
    var acc=el.closest('[data-acc]>button'); if(acc){ acc.parentNode.classList.toggle('open'); return; }
  };
}
function bindOv(){
  $('ovc').onclick=function(e){
    var el=e.target;
    if(el.closest('[data-close]')){ closeOv(); return; }
    var ac=el.closest('[data-act]'); if(ac){ act(ac.getAttribute('data-act')); return; }
    var op=el.closest('[data-open]'); if(op){ route(op.getAttribute('data-open')); return; }
  };
}

load();
})();
</script>
</body>
</html>
